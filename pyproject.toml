[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openai-simple-chatbot"
version = "0.1.0"
description = "A digital twin chatbot powered by OpenAI"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "gradio>=4.0.0",
    "pypdf>=3.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
chatbot = "src.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
